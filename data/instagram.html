<html>

<head>
    <title>Instagram Feed</title>
    <style>
        :root {
            --post-border-radius: 20px;
            --post-aspect-ratio: 0.8;
            --grid-gap: 20px;
            --overlay-bg: rgba(0, 0, 0, 0.4);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #fafafa;
            margin: 0;
            padding: 40px 20px;
        }

        h1 {
            text-align: center;
            font-weight: 300;
            color: #262626;
            margin-bottom: 40px;
        }

        .container {
            max-width: 650px;
            margin: 0 auto;
        }

        .posts {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: var(--grid-gap);
        }

        .post {
            position: relative;
            overflow: hidden;
            border-radius: var(--post-border-radius);
            transition: transform 0.3s ease;
        }

        .post:hover {
            transform: scale(1.01);
        }

        .post-image {
            aspect-ratio: var(--post-aspect-ratio);
            width: 100%;
            display: block;
            position: relative;
        }

        .post-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--overlay-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }

        .post:hover .overlay {
            opacity: 1;
        }

        .instagram-icon {
            fill: white;
            width: 32px;
            height: 32px;
        }
    </style>
</head>
